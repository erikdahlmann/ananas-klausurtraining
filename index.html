<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ananas aus Costa Rica · Klausurtraining</title>
<meta name="description" content="Klausurtraining Erdkunde: Cash Crops in den Tropen am Beispiel Ananas aus Costa Rica. Acht Stufen mit steigender Schwierigkeit und eine Probeklausur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --papier:#f5f1e6; --karte:#fffdf8; --tinte:#22201c; --grau:#6b665c; --linie:rgba(120,112,98,.25);
  --gruen:#1f5a3d; --gruen2:#2e7d55; --gruenhell:#e3efe6;
  --gold:#d9a21b; --goldhell:#fbf0d2; --rot:#b5402f; --rothell:#f8e3df; --blau:#2b6ca3; --blauhell:#e2edf6;
  --grauwasser:#8a8478;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --titel: "Fraunces",var(--serif);
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--serif);font-size:18px;line-height:1.6}
a{color:var(--gruen2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font-family:var(--sans);font-size:16px}

/* Layout */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--gruen);color:#f3efe2;padding:22px 16px 30px;font-family:var(--sans)}
aside .logo{display:flex;gap:10px;align-items:center;margin-bottom:6px}
aside .logo svg{flex:none}
aside h1{font-family:var(--titel);font-size:21px;line-height:1.2;margin:0;font-weight:700}
aside .sub{font-size:13px;opacity:.75;margin:4px 0 18px}
.gesamt{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px}
.balken{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin-top:6px}
.balken i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
nav ol{list-style:none;margin:0;padding:0}
nav li a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#f3efe2;text-decoration:none;font-size:15px;line-height:1.25;min-height:44px}
nav li a:hover{background:rgba(255,255,255,.08)}
nav li a.aktiv{background:#f3efe2;color:var(--gruen)}
nav .nr{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(255,255,255,.14)}
nav a.aktiv .nr{background:var(--gold);color:#1d1a12}
nav .zaehler{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap}
nav .gruppe{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:16px 10px 4px}
main{min-width:0}
.menu-btn{display:none}

/* Kopf */
.kopf{position:relative;min-height:300px;display:flex;align-items:flex-end;color:#fff;background:#244b35 center/cover no-repeat;overflow:hidden}
.kopf::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,35,24,.15) 0%,rgba(15,35,24,.82) 100%)}
.kopf .inhalt{position:relative;padding:34px 44px;max-width:900px}
.kopf .stufe{font-family:var(--sans);font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1d1a12;display:inline-block;padding:4px 10px;border-radius:30px;font-weight:700}
.kopf h2{font-family:var(--titel);font-size:40px;line-height:1.1;margin:12px 0 6px}
.kopf p{margin:0;font-size:19px;opacity:.95;max-width:68ch}
.kopf .ki{position:absolute;right:12px;bottom:8px;font-family:var(--sans);font-size:11px;opacity:.7}

.seite{max-width:920px;margin:0 auto;padding:30px 28px 80px}
.seite > p, .lesen{max-width:68ch}
h3{font-family:var(--titel);font-size:27px;margin:38px 0 10px;color:var(--gruen)}
h4{font-family:var(--sans);font-size:17px;margin:22px 0 8px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:20px 22px;margin:18px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.box{border-left:3px solid var(--gruen2);background:var(--gruenhell);padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0}
.box.gold{border-color:var(--gold);background:var(--goldhell)}
.box.rot{border-color:var(--rot);background:var(--rothell)}
.box.blau{border-color:var(--blau);background:var(--blauhell)}
.box h4{margin-top:0}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.raster:has(> .diagramm){grid-template-columns:1fr;gap:0}
figure{margin:20px 0}
figure img{width:100%;border-radius:var(--radius);display:block}
figcaption{font-family:var(--sans);font-size:13px;color:var(--grau);margin-top:6px}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:15px}
th,td{border-bottom:1px solid var(--linie);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#efe9da}
td.z,th.z{text-align:right;font-variant-numeric:tabular-nums}
.tab-scroll{overflow-x:auto}
.quelle{font-family:var(--sans);font-size:12px;color:var(--grau);margin-top:8px}
.mat{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--gruen);letter-spacing:.03em}

/* Übungen */
.ueb{background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);padding:18px 20px;margin:18px 0;position:relative}
.ueb.fertig{border-color:var(--gruen2);box-shadow:inset 4px 0 0 var(--gruen2)}
.ueb .kopfzeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--sans);font-size:13px;margin-bottom:8px}
.badge{padding:3px 9px;border-radius:20px;font-weight:700;font-size:12px}
.b1{background:#dcefe2;color:#1f5a3d}.b2{background:#fbeccc;color:#7a5a08}.b3{background:#f6dcd6;color:#8b2c1f}.b4{background:#22201c;color:#fff}
.ueb .frage{font-weight:600;margin:4px 0 10px}
.optionen{display:grid;gap:8px}
.opt{display:block;text-align:left;width:100%;padding:11px 14px;border:1.5px solid var(--linie);background:#fff;border-radius:10px;cursor:pointer;min-height:44px;line-height:1.35}
.opt:hover{border-color:var(--gruen2)}
.opt.richtig{border-color:var(--gruen2);background:var(--gruenhell)}
.opt.falsch{border-color:var(--rot);background:var(--rothell)}
.rueck{font-family:var(--sans);font-size:15px;margin-top:10px;padding:10px 12px;border-radius:8px;display:none}
.rueck.zeigen{display:block}
.rueck.ok{background:var(--gruenhell);color:#174a31}
.rueck.no{background:var(--rothell);color:#7d2416}
.zeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number]{padding:9px 11px;border:1.5px solid var(--linie);border-radius:8px;min-height:44px;width:140px;background:#fff}
select{padding:8px 10px;border:1.5px solid var(--linie);border-radius:8px;min-height:44px;background:#fff;max-width:100%}
textarea{width:100%;min-height:160px;padding:12px;border:1.5px solid var(--linie);border-radius:10px;background:#fff;line-height:1.5;font-family:var(--serif);font-size:17px}
.knopf{background:var(--gruen);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px;font-weight:600}
.knopf:hover{background:var(--gruen2)}
.knopf.leise{background:transparent;color:var(--gruen);border:1.5px solid var(--gruen)}
.knopf.leise:hover{background:var(--gruenhell)}
details.loesung{margin-top:12px;border-left:3px solid var(--gold);background:var(--goldhell);border-radius:0 10px 10px 0;padding:8px 14px}
details.loesung summary{cursor:pointer;font-family:var(--sans);font-weight:700;font-size:15px;min-height:32px;display:flex;align-items:center}
.hinweis{font-family:var(--sans);font-size:14px;color:var(--grau)}
.check li{list-style:none;margin-left:-22px}
.check label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;flex:none}

/* Sortieren */
.sortliste{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.sortliste li{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--linie);border-radius:10px;padding:8px 10px;line-height:1.35}
.sortliste li .pf{display:flex;flex-direction:column;gap:2px;flex:none}
.sortliste li .pf button{border:1px solid var(--linie);background:#f7f3ea;border-radius:6px;width:36px;height:22px;cursor:pointer;font-size:12px;line-height:1}
.sortliste li.richtig{border-color:var(--gruen2);background:var(--gruenhell)}
.sortliste li.falsch{border-color:var(--rot);background:var(--rothell)}
.zuordnen{display:grid;gap:10px}
.zuordnen .z-zeile{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--linie);border-radius:10px;padding:8px 12px;line-height:1.35}
.zuordnen .z-zeile.richtig{border-color:var(--gruen2);background:var(--gruenhell)}
.zuordnen .z-zeile.falsch{border-color:var(--rot);background:var(--rothell)}
.zuordnen .z-zeile .sel{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Karteikarten */
.karteikarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kk{display:block;width:100%;perspective:900px;height:170px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.kk .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.kk.um .in{transform:rotateY(180deg)}
.kk .vs,.kk .rs{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.kk .vs{background:var(--gruen);color:#fff;font-family:var(--titel);font-size:20px;font-weight:700}
.kk .rs{background:#fff;border:1.5px solid var(--gruen2);transform:rotateY(180deg);font-size:14.5px;line-height:1.4;font-family:var(--sans);overflow:auto;align-items:flex-start}

/* Fehlerfinder */
.fehlertext{line-height:2;background:#fff;border:1.5px solid var(--linie);border-radius:10px;padding:14px 16px}
.fehlertext .ff{border-bottom:2px dotted var(--grau);cursor:pointer;padding:1px 2px;border-radius:4px}
.fehlertext .ff.markiert{background:var(--goldhell);border-bottom-color:var(--gold)}
.fehlertext .ff.richtig{background:var(--gruenhell);border-bottom-color:var(--gruen2)}
.fehlertext .ff.falsch{background:var(--rothell);border-bottom-color:var(--rot)}

/* Diagramme */
.diagramm{background:#fff;border:1px solid var(--linie);border-radius:var(--radius);padding:14px 14px 8px;margin:16px 0;position:relative}
.diagramm h5{font-family:var(--sans);font-size:15px;margin:0 0 4px}
.diagramm > svg{width:100%;height:auto;display:block;overflow:visible}
.diagramm svg text{font-family:var(--sans);fill:#4a463e}
.tip{position:absolute;pointer-events:none;background:var(--tinte);color:#fff;font-family:var(--sans);font-size:13px;padding:5px 9px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.legende{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--sans);font-size:13px;color:#4a463e;margin:6px 0}
.legende span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.umschalter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.umschalter button{border:1.5px solid var(--linie);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;min-height:36px}
.umschalter button.an{background:var(--gruen);color:#fff;border-color:var(--gruen)}

/* Karte */
#karte,#karte2{height:540px;border-radius:var(--radius);border:1px solid var(--linie);z-index:1}
.koord{font-family:var(--sans);font-size:14px;margin-top:6px;color:var(--grau)}
.leaflet-tooltip.lbl{background:rgba(255,253,248,.92);border:1px solid var(--linie);font-family:var(--sans);font-size:12px;font-weight:600;color:var(--tinte);box-shadow:none}
.leaflet-tooltip.zone{background:rgba(154,107,0,.88);color:#fff;border:0;text-align:center}
.leaflet-tooltip.zone::before{display:none}
.grad-lbl{font-family:var(--sans);font-size:11px;color:#3a5a78;font-weight:700;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}

/* Dreieck */
.dreieck-wrap{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:20px;align-items:start}
.karte-satz{display:grid;grid-template-columns:1fr;gap:6px;background:#fff;border:1.5px solid var(--linie);border-radius:10px;padding:10px 12px;line-height:1.35}
.karte-satz .sel{display:flex;gap:6px;flex-wrap:wrap}
.karte-satz.richtig{border-color:var(--gruen2);background:var(--gruenhell)}
.karte-satz.falsch{border-color:var(--rot);background:var(--rothell)}

/* Weg der Ananas */
.weg svg{width:100%;height:auto}
.weg .schritt{font-family:var(--sans);font-size:14px}

/* Probeklausur */
.timer{position:sticky;top:10px;z-index:20;display:flex;gap:10px;align-items:center;justify-content:flex-end;font-family:var(--sans)}
.timer .uhr{background:var(--tinte);color:#fff;border-radius:10px;padding:8px 14px;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.punkte{font-family:var(--sans);font-weight:700;color:var(--gruen)}
.ew td:last-child,.ew th:last-child{text-align:center;width:70px}
.ew input{width:20px;height:20px}
.navknoepfe{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}

.leiter{display:grid;gap:10px;margin:18px 0}
.leiter a{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:10px 14px}
.leiter a:hover{border-color:var(--gruen2)}
.leiter .stu{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--titel);font-weight:700;font-size:22px;color:#fff}
.leiter b{font-family:var(--sans);display:block;font-size:16px}
.leiter small{font-family:var(--sans);color:var(--grau);font-size:13px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:1000;transform:translateX(-102%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  aside.offen{transform:none}
  .menu-btn{display:flex;position:fixed;left:12px;top:12px;z-index:1001;background:var(--gruen);color:#fff;border:0;border-radius:10px;width:46px;height:46px;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .kopf .inhalt{padding:70px 16px 24px}
  .kopf h2{font-size:30px}
  .seite{padding:22px 16px 70px}
  .dreieck-wrap{grid-template-columns:1fr}
  #karte,#karte2{height:380px}
  body{font-size:17px}
}
@media print{
  aside,.menu-btn,.timer,.navknoepfe,.knopf{display:none!important}
  .app{display:block}
  details{display:block} details>*{display:block}
  .kopf{min-height:auto;color:#000;background:none!important}.kopf::before{display:none}
}
</style>
</head>

/* ============ Fortschritt ============ */
const SPEICHER="ananas-cr";
function lade(k,def){try{const v=localStorage.getItem(SPEICHER+"-"+k);return v===null?def:JSON.parse(v)}catch(e){return def}}

const NIVEAU = {1:["basal","b1"],2:["mittel","b2"],3:["anspruchsvoll","b3"],4:["Klausurniveau","b4"]};
function kopf(n,afb){const [t,c]=NIVEAU[n];return `<div class="kopfzeile"><span class="badge ${c}">${t}</span>${afb?`<span class="hinweis">${afb}</span>`:""}</div>`}

function mc(id,n,frage,opts,richtig,erkl,afb){
  // opts: Array von Strings; richtig: Index
  reg(id);
  return `<div class="ueb" data-ueb="${id}">${kopf(n,afb)}<div class="frage">${frage}</div>
  <div class="optionen">${opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="mcKlick(this,'${id}',${richtig})">${o}</button>`).join("")}</div>
  <div class="rueck" id="r-${id}"></div><template id="e-${id}">${erkl}</template></div>`;
}
function mcKlick(btn,id,richtig){
  const box=btn.closest(".ueb"); const i=+btn.dataset.i; const r=document.getElementById("r-"+id);
  box.querySelectorAll(".opt").forEach(b=>b.classList.remove("richtig","falsch"));
  if(i===richtig){btn.classList.add("richtig");r.className="rueck zeigen ok";r.innerHTML="Richtig. "+document.getElementById("e-"+id).innerHTML;markiere(id);}
  else{btn.classList.add("falsch");r.className="rueck zeigen no";r.innerHTML="Noch nicht. Lies die Frage noch einmal genau und versuche es erneut.";}
}

function num(id,n,frage,soll,tol,einheit,erkl,afb){
  reg(id);
  return `<div class="ueb" data-ueb="${id}">${kopf(n,afb)}<div class="frage">${frage}</div>
  <div class="zeile"><input type="text" inputmode="decimal" id="i-${id}" aria-label="Antwort" onkeydown="if(event.key==='Enter')numPruef('${id}',${soll},${tol})"> <span>${einheit}</span>
  <button class="knopf" onclick="numPruef('${id}',${soll},${tol})">Prüfen</button></div>
  <div class="rueck" id="r-${id}"></div><template id="e-${id}">${erkl}</template></div>`;
}
function numPruef(id,soll,tol){
  const roh=document.getElementById("i-"+id).value.trim().replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");
  const v=parseFloat(roh); const r=document.getElementById("r-"+id);
  if(isNaN(v)){r.className="rueck zeigen no";r.textContent="Bitte eine Zahl eingeben.";return;}
  if(Math.abs(v-soll)<=tol){r.className="rueck zeigen ok";r.innerHTML="Richtig. "+document.getElementById("e-"+id).innerHTML;markiere(id);}
  else{r.className="rueck zeigen no";r.innerHTML=(v>soll?"Zu groß.":"Zu klein.")+" Prüfe deinen Ansatz. <details class='loesung'><summary>Lösungsweg zeigen</summary>"+document.getElementById("e-"+id).innerHTML+"</details>";}
}

function ordnen(id,n,frage,items,erkl,afb){
  // items in richtiger Reihenfolge; Anzeige gemischt
  reg(id);
  const gemischt=mische(items.map((t,i)=>({t,i})),id);
  return `<div class="ueb" data-ueb="${id}">${kopf(n,afb)}<div class="frage">${frage}</div>
  <ol class="sortliste" id="s-${id}">${gemischt.map(o=>`<li data-i="${o.i}"><span class="pf"><button aria-label="nach oben" onclick="schiebe(this,-1)">▲</button><button aria-label="nach unten" onclick="schiebe(this,1)">▼</button></span><span>${o.t}</span></li>`).join("")}</ol>
  <div class="zeile" style="margin-top:10px"><button class="knopf" onclick="ordnenPruef('${id}')">Reihenfolge prüfen</button></div>
  <div class="rueck" id="r-${id}"></div><template id="e-${id}">${erkl}</template></div>`;
}
function schiebe(b,d){const li=b.closest("li");const ul=li.parentNode;ul.querySelectorAll("li").forEach(x=>x.classList.remove("richtig","falsch"));
  if(d<0&&li.previousElementSibling)ul.insertBefore(li,li.previousElementSibling);
  if(d>0&&li.nextElementSibling)ul.insertBefore(li.nextElementSibling,li);
  b.focus();}
function ordnenPruef(id){
  const lis=[...document.querySelectorAll(`#s-${id} li`)];let ok=0;
  lis.forEach((li,pos)=>{const r=+li.dataset.i===pos;li.classList.toggle("richtig",r);li.classList.toggle("falsch",!r);if(r)ok++;});
  const r=document.getElementById("r-"+id);
  if(ok===lis.length){r.className="rueck zeigen ok";r.innerHTML="Alles in der richtigen Reihenfolge. "+document.getElementById("e-"+id).innerHTML;markiere(id);}
  else{r.className="rueck zeigen no";r.textContent=`${ok} von ${lis.length} Karten stehen richtig. Verschiebe die roten Karten.`;}
}

function fehler(id,n,frage,teile,erkl,afb){
  // teile: Strings oder [text, istFehler, korrektur]
  reg(id);
  let html=teile.map((t,i)=>typeof t==="string"?t:`<span class="ff" data-f="${t[1]?1:0}" data-k="${(t[2]||"").replace(/"/g,"&quot;")}" tabindex="0" role="button" onclick="this.classList.toggle('markiert')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('markiert')}">${t[0]}</span>`).join("");
  return `<div class="ueb" data-ueb="${id}">${kopf(n,afb)}<div class="frage">${frage}</div>
  <div class="fehlertext" id="f-${id}">${html}</div>
  <div class="zeile" style="margin-top:10px"><button class="knopf" onclick="fehlerPruef('${id}')">Prüfen</button></div>
  <div class="rueck" id="r-${id}"></div><template id="e-${id}">${erkl}</template></div>`;
}
function fehlerPruef(id){
  const sp=[...document.querySelectorAll(`#f-${id} .ff`)];let treffer=0,falschM=0,ges=0;let korr=[];
  sp.forEach(s=>{const f=s.dataset.f==="1",m=s.classList.contains("markiert");s.classList.remove("richtig","falsch");
    if(f){ges++; if(m){treffer++;s.classList.add("richtig");korr.push(`<li><b>${s.textContent}</b>: ${s.dataset.k}</li>`);} }
    else if(m){falschM++;s.classList.add("falsch");}});
  const r=document.getElementById("r-"+id);
  if(treffer===ges&&falschM===0){r.className="rueck zeigen ok";r.innerHTML=`Alle ${ges} Fehler gefunden.<ul>${korr.join("")}</ul>`+document.getElementById("e-"+id).innerHTML;markiere(id);}
  else{r.className="rueck zeigen no";r.innerHTML=`${treffer} von ${ges} Fehlern gefunden${falschM?`, ${falschM} Stelle(n) markiert, die stimmen`:""}. Rot markierte Stellen sind korrekt, grüne sind echte Fehler.`;}
}

function reg(id){UEB[id]=aktuellesThema;}
function mische(arr,seed){let s=[...seed].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);const a=arr.slice();for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((x,i)=>x.i===i)&&a.length>1)[a[0],a[1]]=[a[1],a[0]];return a;}

/* ============ Diagramme (SVG) ============ */
const NS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function tipp(container){let t=container.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";container.appendChild(t);}return {
  zeig(html,x,y){t.innerHTML=html;t.style.opacity=1;const w=t.offsetWidth;let l=x+12;if(l+w>container.clientWidth-4)l=x-w-12;t.style.left=Math.max(4,l)+"px";t.style.top=(y-34)+"px";},
  weg(){t.style.opacity=0;}};}
function mausPos(e,cont){const r=cont.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}

function klimadiagramm(el,K){
  const W=520,H=360,L=50,R=56,T=34,B=40; const pw=W-L-R, ph=H-T-B;
  const maxU=Math.max(60, Math.ceil(Math.max(...K.N.map(n=>n<=100?n/2:50+(n-100)/20))/10)*10);
  const yU=u=>T+ph-(u/maxU)*ph; const yN=n=>yU(n<=100?n/2:50+(n-100)/20); const yT=t=>yU(t);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Klimadiagramm "+K.name,style:"max-width:580px;margin:0 auto"});
  const g=svgEl("g",{},svg);
  // Gitter + Achsen
  for(let u=0;u<=maxU;u+=10){const y=yU(u);svgEl("line",{x1:L,x2:L+pw,y1:y,y2:y,stroke:"rgba(120,112,98,.18)"},g);
    if(u<=50){svgEl("text",{x:L-8,y:y+4,"text-anchor":"end","font-size":12},g).textContent=u;}
    const mm=u<=50?u*2:100+(u-50)*20; svgEl("text",{x:L+pw+8,y:y+4,"font-size":12},g).textContent=mm;}
  svgEl("text",{x:L-8,y:T-14,"text-anchor":"end","font-size":12,"font-weight":700,fill:"#b5402f"},g).textContent="°C";
  svgEl("text",{x:L+pw+8,y:T-14,"font-size":12,"font-weight":700,fill:"#2b6ca3"},g).textContent="mm";
  const bw=pw/12;
  // aride Monate markieren
  K.N.forEach((n,i)=>{ if(n<2*K.T[i]) svgEl("rect",{x:L+i*bw,y:T,width:bw,height:ph,fill:"rgba(217,162,27,.13)"},g); });
  // Niederschlagssäulen
  K.N.forEach((n,i)=>{const y=yN(n);const r=svgEl("rect",{x:L+i*bw+bw*.18,y,width:bw*.64,height:T+ph-y,fill:n>100?"#1d4f7c":"#5b95c7",rx:2},g);});
  // Temperaturkurve
  const pts=K.T.map((t,i)=>`${L+i*bw+bw/2},${yT(t)}`).join(" ");
  svgEl("polyline",{points:pts,fill:"none",stroke:"#b5402f","stroke-width":2.6,"stroke-linejoin":"round"},g);
  K.T.forEach((t,i)=>svgEl("circle",{cx:L+i*bw+bw/2,cy:yT(t),r:3,fill:"#b5402f"},g));
  MON.forEach((m,i)=>{svgEl("text",{x:L+i*bw+bw/2,y:T+ph+18,"text-anchor":"middle","font-size":12},g).textContent=m;});
  svgEl("line",{x1:L,x2:L+pw,y1:T+ph,y2:T+ph,stroke:"#4a463e"},g);
  // Kopfzeile
  const sumN=K.N.reduce((a,b)=>a+b,0), mT=K.T.reduce((a,b)=>a+b,0)/12;
  svgEl("text",{x:L,y:14,"font-size":13,"font-weight":700},g).textContent=K.name;
  svgEl("text",{x:L+pw,y:14,"text-anchor":"end","font-size":12},g).textContent=K.lage;
  el.innerHTML=`<div class="legende"><span style="--c:#5b95c7">Niederschlag bis 100 mm</span><span style="--c:#1d4f7c">über 100 mm (Maßstab 1:10 verkürzt)</span><span style="--c:#b5402f">Temperatur</span><span style="--c:rgba(217,162,27,.4)">arider Monat</span></div>`;
  el.appendChild(svg);
  // Hover
  const tp=tipp(el); const hit=svgEl("rect",{x:L,y:T,width:pw,height:ph,fill:"transparent"},g);
  hit.addEventListener("mousemove",e=>{const [mx,my]=mausPos(e,el);const sx=W/svg.getBoundingClientRect().width;const i=Math.min(11,Math.max(0,Math.floor(((e.clientX-svg.getBoundingClientRect().left)*sx-L)/bw)));
    tp.zeig(`<b>${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][i]}</b>: ${fmt(K.T[i],1)} °C · ${fmt(K.N[i],1)} mm`,mx,my);});
  hit.addEventListener("mouseleave",()=>tp.weg());
  el.dataset.summen=`${sumN}|${mT}`;
}

function linien(el,opt){
  // opt: {daten:[[x,y]], yMax, yEinheit, xTicks, farbe, label, fmtY}
  const W=640,H=320,L=64,R=20,T=20,B=36,pw=W-L-R,ph=H-T-B;
  const xs=opt.daten.map(d=>d[0]);const x0=opt.xMin??Math.min(...xs),x1=opt.xMax??Math.max(...xs);
  const X=x=>L+(x-x0)/(x1-x0)*pw, Y=y=>T+ph-(y/opt.yMax)*ph;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opt.label,style:"max-width:720px;margin:0 auto"});
  for(let i=0;i<=opt.ySchritte;i++){const v=opt.yMax/opt.ySchritte*i;const y=Y(v);svgEl("line",{x1:L,x2:L+pw,y1:y,y2:y,stroke:"rgba(120,112,98,.18)"},svg);
    svgEl("text",{x:L-8,y:y+4,"text-anchor":"end","font-size":12},svg).textContent=opt.fmtY(v);}
  (opt.xTicks||xs).forEach(x=>{svgEl("text",{x:X(x),y:T+ph+20,"text-anchor":"middle","font-size":12},svg).textContent=x;});
  svgEl("line",{x1:L,x2:L+pw,y1:T+ph,y2:T+ph,stroke:"#4a463e"},svg);
  if(opt.flaeche){const p=`M${X(opt.daten[0][0])},${Y(0)} `+opt.daten.map(d=>`L${X(d[0])},${Y(d[1])}`).join(" ")+` L${X(opt.daten.at(-1)[0])},${Y(0)} Z`;svgEl("path",{d:p,fill:opt.farbe,opacity:.12},svg);}
  svgEl("polyline",{points:opt.daten.map(d=>`${X(d[0])},${Y(d[1])}`).join(" "),fill:"none",stroke:opt.farbe,"stroke-width":2.6,"stroke-linejoin":"round"},svg);
  const tp=tipp(el);
  opt.daten.forEach(d=>{const c=svgEl("circle",{cx:X(d[0]),cy:Y(d[1]),r:5,fill:"#fff",stroke:opt.farbe,"stroke-width":2.4,tabindex:0},svg);
    const zeig=e=>{const r=el.getBoundingClientRect(),cr=c.getBoundingClientRect();tp.zeig(`<b>${d[0]}</b>: ${opt.fmtTip(d[1])}`,cr.left-r.left+cr.width/2,cr.top-r.top);c.setAttribute("r",7);};
    c.addEventListener("mouseenter",zeig);c.addEventListener("focus",zeig);c.addEventListener("mouseleave",()=>{tp.weg();c.setAttribute("r",5)});c.addEventListener("blur",()=>{tp.weg();c.setAttribute("r",5)});});
  if(opt.y2Label)svgEl("text",{x:L,y:12,"font-size":12,"font-weight":700},svg).textContent=opt.y2Label;
  el.appendChild(svg);
}

function balken(el,opt){
  // horizontale Balken: opt.daten [[label,wert,farbe?]], opt.max, opt.fmt, opt.hervor (label)
  const zeilenH=34,L=opt.L||170,R=70,W=640,H=opt.daten.length*zeilenH+10;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opt.label,style:"max-width:720px"});
  const pw=W-L-R;
  opt.daten.forEach((d,i)=>{const y=i*zeilenH+6;const w=Math.max(2,d[1]/opt.max*pw);
    svgEl("text",{x:L-10,y:y+17,"text-anchor":"end","font-size":13,"font-weight":d[0]===opt.hervor?700:400},svg).textContent=d[0];
    const r=svgEl("rect",{x:L,y,width:0,height:22,rx:3,fill:d[2]||(d[0]===opt.hervor?"#d9a21b":"#2e7d55")},svg);
    requestAnimationFrame(()=>{r.style.transition="width .7s ease";r.setAttribute("width",w);});
    svgEl("text",{x:L+w+8,y:y+16,"font-size":13},svg).textContent=opt.fmt(d[1]);});
  el.appendChild(svg);
}

function donut(el,daten,label){
  const W=360,H=240,cx=120,cy=120,r=95,ri=58;const sum=daten.reduce((a,d)=>a+d[1],0);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":label,style:"max-width:480px"});let a=-Math.PI/2;const tp=tipp(el);
  daten.forEach(d=>{const w=d[1]/sum*2*Math.PI;const a2=a+w;const gross=w>Math.PI?1:0;
    const p=`M${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${gross} 1 ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} L${cx+ri*Math.cos(a2)},${cy+ri*Math.sin(a2)} A${ri},${ri} 0 ${gross} 0 ${cx+ri*Math.cos(a)},${cy+ri*Math.sin(a)} Z`;
    const s=svgEl("path",{d:p,fill:d[2],stroke:"#fff","stroke-width":2},svg);
    s.addEventListener("mousemove",e=>{const [x,y]=mausPos(e,el);tp.zeig(`<b>${d[0]}</b>: ${d[1]} %`,x,y)});s.addEventListener("mouseleave",()=>tp.weg());a=a2;});
  svgEl("text",{x:cx,y:cy-2,"text-anchor":"middle","font-size":13,"font-weight":700},svg).textContent="Exporte";

function karteBauen(id,optionen={}){

  for(let lo=-87;lo<=-82;lo++){L.polyline([[7.5,lo],[12,lo]],{color:"#3a5a78",weight:1.2,dashArray:"4 4",opacity:.8,interactive:false}).addTo(map);

  if(optionen.zonen!==false){ZONEN.forEach(z=>L.circle(z.ll,{radius:z.r,color:"#9a6b00",weight:2.5,fillColor:"#f2c230",fillOpacity:.45}).bindTooltip(`${z.n} ${z.anteil.split(" ")[0]} %`,{className:"lbl zone",direction:"center",permanent:true}).bindPopup(`<b>${z.n}</b><br>${z.anteil}`).addTo(map));}
  ORTE.forEach(o=>{if(o.verbergen&&optionen.quiz)return;const farbe=o.typ==="hafen"?"#2b6ca3":o.typ==="berg"?"#7a4b22":"#22201c";
    L.circleMarker(o.ll,{radius:o.typ==="stadt"?7:5,color:"#fff",weight:2,fillColor:farbe,fillOpacity:1}).bindTooltip(o.fest?o.n:`<b>${o.n}</b><br>${o.info}`,{className:"lbl",direction:"right",permanent:!!o.fest}).addTo(map);});

  (window._karten=window._karten||[]).push(map);

}
function gm(v,p,n){const a=Math.abs(v);const g=Math.floor(a);let m=Math.round((a-g)*60);let gg=g;if(m===60){gg++;m=0;}return `${gg}°${String(m).padStart(2,"0")}′ ${v>=0?p:n}`;}

function ewBlock(n,kopfz,zeilen){
  const max=zeilen.reduce((a,z)=>a+z[1],0);
  return `<details class="loesung"><summary>Aufgabe ${n} (${max} Punkte) · ${kopfz}</summary>
  <table class="ew"><tr><th>Erwartung</th><th>Punkte</th><th>✓</th></tr>
  ${zeilen.map((z,i)=>`<tr><td>${z[0]}</td><td class="z">${z[1]}</td><td><input type="number" min="0" max="${z[1]}" value="${lade(`ew-${n}-${i}`,"")}" style="width:64px" aria-label="erreichte Punkte" oninput="sichere('ew-${n}-${i}',this.value);ewSumme()"></td></tr>`).join("")}
  </table><p class="hinweis">Trage deine Punkte selbst ein (höchstens die Maximalpunktzahl).</p></details>`;
}
function ewSumme(){let s=0;document.querySelectorAll(".ew input").forEach(i=>{const v=Math.min(+i.max,Math.max(0,+i.value||0));s+=v;});const e=document.getElementById("pk-summe");if(e)e.textContent=`Deine Punkte: ${s} von 100`;if(s>=50)markiere("pk");}
let timerId=null;
function timerStart(){const ende=Date.now()+135*60000;sichere("timer",ende);timerLauf();}
function timerStop(){sichere("timer",null);clearInterval(timerId);const u=document.getElementById("uhr");if(u)u.textContent="135:00";}
function timerLauf(){clearInterval(timerId);const ende=lade("timer",null);if(!ende)return;const tick=()=>{const u=document.getElementById("uhr");if(!u){clearInterval(timerId);return;}const r=Math.max(0,ende-Date.now());const m=Math.floor(r/60000),s=Math.floor(r%60000/1000);u.textContent=`${m}:${String(s).padStart(2,"0")}`;if(r===0){clearInterval(timerId);u.textContent="Zeit ist um";}};tick();timerId=setInterval(tick,1000);}

/* ============ Weg der Ananas (Animation) ============ */
function wegBauen(el){
  const st=[["🌱","Feld","Pflanzung, nach 14–18 Monaten Ernte von Hand"],["🏭","Packstation","waschen, wachsen, sortieren, in Kartons packen"],["🚚","Lkw","Kühltransport zum Hafen, wenige Stunden"],["⚓","Puerto Limón","90 % der Exporte, Kühlcontainer"],["🚢","Schiff","12–15 Tage nach Houston, 14–20 Tage nach Nordeuropa"],["🛒","Supermarkt","Reifeprüfung, Verteilung an Märkte"]];
  const W=900,H=170;const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Weg der Ananas vom Feld zum Supermarkt"});
  const y=60;svgEl("path",{d:`M60 ${y} C 250 ${y-40}, 400 ${y+40}, 520 ${y} S 760 ${y-30}, 840 ${y}`,fill:"none",stroke:"#d9a21b","stroke-width":4,"stroke-dasharray":"8 8",id:"wegpfad"},svg);
  st.forEach((s,i)=>{const x=60+i*156;const g=svgEl("g",{},svg);svgEl("circle",{cx:x,cy:y,r:26,fill:"#fffdf8",stroke:"#1f5a3d","stroke-width":2.5},g);
    const t=svgEl("text",{x,y:y+8,"text-anchor":"middle","font-size":22},g);t.textContent=s[0];
    svgEl("text",{x,y:y+50,"text-anchor":"middle","font-size":14,"font-weight":700},g).textContent=s[1];
    const lines=s[2].match(/.{1,24}(\s|$)/g)||[s[2]];lines.forEach((l,j)=>{svgEl("text",{x,y:y+68+j*15,"text-anchor":"middle","font-size":11.5,fill:"#6b665c"},g).textContent=l.trim();});});
  const ball=svgEl("text",{"font-size":24},svg);ball.textContent="🍍";
  const p=svg.querySelector("#wegpfad");el.appendChild(svg);
  let t0=null;const len=p.getTotalLength();
  function anim(ts){if(!document.body.contains(svg))return;if(!t0)t0=ts;const f=((ts-t0)/9000)%1;const pt=p.getPointAtLength(f*len);ball.setAttribute("x",pt.x-12);ball.setAttribute("y",pt.y-14);requestAnimationFrame(anim);}
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(anim);else{ball.setAttribute("x",48);ball.setAttribute("y",y-30);}
}

/* ============ Router ============ */
function zeige(id){
  const t=THEMEN.find(x=>x.id===id)||THEMEN[0];aktuellesThema=t.id;sichere("letztes",t.id);
  const i=THEMEN.indexOf(t);const vor=THEMEN[i-1],nach=THEMEN[i+1];
  const main=document.getElementById("main");
  main.innerHTML=`<header class="kopf" style="background-image:url('${BILDER[t.bild]}')"><div class="inhalt"><span class="stufe">${t.stufe}</span><h2>${t.titel}</h2><p>${t.unter}</p></div><span class="ki">Foto KI-generiert, stilisiert</span></header>
  <div class="seite">${SEITEN[t.id]()}
  <div class="navknoepfe">${vor?`<a class="knopf leise" href="#${vor.id}" style="text-decoration:none">← ${vor.titel}</a>`:"<span></span>"}${nach?`<a class="knopf" href="#${nach.id}" style="text-decoration:none">${nach.titel} →</a>`:""}</div></div>`;
  if(NACH[t.id])NACH[t.id]();
  document.querySelectorAll("[data-ueb]").forEach(e=>{if(erledigt[e.dataset.ueb])e.classList.add("fertig");});
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("aktiv",a.getAttribute("href")==="#"+t.id));
  document.querySelector("aside").classList.remove("offen");
  window.scrollTo(0,0);zaehle();
}
function zaehle(){
  let ges=0,ok=0;
  THEMEN.forEach(t=>{const ids=ALLE_UEB[t.id]||[];const n=ids.filter(x=>erledigt[x]).length;ges+=ids.length;ok+=n;
    document.querySelectorAll(`[data-zaehler="${t.id}"]`).forEach(z=>z.textContent=ids.length?`${n}/${ids.length}`:"");});
  document.getElementById("gesamtText").textContent=`${ok} von ${ges} Aufgaben gelöst`;
  document.getElementById("gesamtBalken").style.width=(ges?ok/ges*100:0)+"%";
}
function init(){
  // Alle Seiten einmal „trocken“ rendern, um die Übungen zu zählen
  THEMEN.forEach(t=>{aktuellesThema=t.id;SEITEN[t.id]();});
  for(const id in UEB){(ALLE_UEB[UEB[id]]=ALLE_UEB[UEB[id]]||[]).push(id);}
  let gruppe="";
  document.getElementById("navliste").innerHTML=THEMEN.map(t=>{let g="";if(t.gruppe!==gruppe){gruppe=t.gruppe;g=`<li class="gruppe">${gruppe}</li>`;}
    return g+`<li><a href="#${t.id}"><span class="nr">${t.nr}</span><span>${t.titel}</span><span class="zaehler" data-zaehler="${t.id}"></span></a></li>`;}).join("");
  window.addEventListener("hashchange",()=>zeige(location.hash.slice(1)));
  document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;const i=THEMEN.findIndex(t=>t.id===aktuellesThema);
    if(e.key==="ArrowRight"&&THEMEN[i+1])location.hash=THEMEN[i+1].id;if(e.key==="ArrowLeft"&&THEMEN[i-1])location.hash=THEMEN[i-1].id;});
  zeige(location.hash.slice(1)||lade("letztes","start"));
}
init();
</script>
